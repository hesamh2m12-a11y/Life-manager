<style>

.tree ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--c);height:28px}

.nb.dn{opacity:.6}.nb.dn .nt{text-decoration:line-through}

.bars{display:grid;gap:15px}.rowt{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:7px}.trk{height:12px;border-radius:99px;background:var(--s2);overflow:hidden}.fl{height:100%;border-radius:99px}
h3{font-size:14px;margin-bottom:16px;color:var(--mu);font-weight:600}

.mb{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px)}.mb.on{display:flex}
.modal{background:var(--s);border:1px solid var(--ln);border-radius:22px;width:100%;max-width:440px;padding:22px;max-height:90vh;overflow:auto;animation:up .25s ease-out}@keyframes up{from{transform:translateY(20px);opacity:0}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-weight:800;font-size:16px;gap:10px}.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.f{display:grid;gap:7px;margin-bottom:14px}.f label{font-size:12.5px;color:var(--mu)}.f input{padding:13px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;font-size:15px}.f input:focus{outline:none;border-color:var(--ac)}
.hint{font-size:12px;color:var(--mu);line-height:1.8}.sec{margin-bottom:22px}.sec>label{display:block;font-size:12.5px;color:var(--mu);margin-bottom:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1 1 30%;padding:10px;border-radius:11px;border:1px solid var(--ln);background:var(--s2);font-size:13px;font-weight:600}.seg button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,var(--s2))}
.th{height:48px;position:relative;border:2px solid var(--ln)!important;margin-bottom:18px}.th.on{border-color:var(--tx)!important}.th span{position:absolute;top:100%;inset-inline:0;margin-top:3px;font-size:10.5px;color:var(--mu);font-weight:500}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--ac);padding:11px 20px;border-radius:12px;font-size:13px;display:none;z-index:200}.toast.on{display:block}
.warn{background:#7f1d1d;color:#fff;padding:9px 16px;font-size:12.5px;text-align:center}.fab{display:none}
@media(max-width:760px){.hdr{padding-inline:14px}.hdr h1{font-size:15px}.top{display:none}
 .tabs{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;box-shadow:0 14px 30px -8px #000}.tab{padding:11px 26px}
 .fab{display:grid;place-items:center;position:fixed;z-index:20;bottom:max(14px,env(safe-area-inset-bottom));inset-inline-end:16px;width:54px;height:54px;border-radius:50%;font-size:26px;padding:0}
 .hero{grid-template-columns:1fr;justify-items:center}.big-ring{width:230px;height:230px}.bars{width:100%}.card{padding:16px}.mb{align-items:flex-end}.modal{max-width:100%;border-radius:24px 24px 0 0}.toast{bottom:150px}}

 const chk=dl?`<button class="chk${n.done?' d':''}${S.just===n.id?' pop':''}" data-a="tg" data-id="${id}" role="checkbox" aria-checked="${n.done}">${n.done?'✓':''}</button>`:'';
 const box=`<div class="nb${n.done?' dn':''}" style="--c:${c};--k:${ink(c)}"><div class="nh">${chk}<div class="nt">${esc(tx(n))}</div></div><div class="nm"><span>${esc(t(n.type))}${has?' · '+has:''}</span>${dl?'':`<b>${p}%</b>`}</div>${dl?'':`<div class="pb"><i style="width:${p}%"></i></div>`}<div class="na">${ib('ed',n.id,'✎',t('edit'))}${ib('dl',n.id,'✕',t('del'))}${dl||!has?'':ib('op',n.id,op?'▾':'▸',n.title.en)}</div>${nl?`<button class="plus" style="--p:${CL[i+1]}" data-a="ad" data-id="${id}" aria-label="${esc(t('addP')+' · '+t(nl))}" title="${esc(t('addP')+' · '+t(nl))}">＋</button>`:''}</div>`;
 return`<li style="--c:${c}">${box}${!dl&&op&&has?`<ul>${n.children.map(ch=>node(ch,mi)).join('')}</ul>`:''}</li>`;}
const goal=(g,mi)=>`<section class="tbox" style="--c:${MC[mi%6]}"><div class="tscroll"><div class="tree"><ul>${node(g,mi)}</ul></div></div></section>`;
function viewG(){if(!S.goals.length)return`<div class="empty"><div class="big">🌱</div><h2>${esc(t('emptyT'))}</h2><p>${esc(t('emptyP'))}</p><button class="cta" data-a="ng">${esc(t('newGoal'))}</button></div>`;return`<div class="tools"><button class="ib" data-a="zo" aria-label="zoom out">－</button><button class="ib" data-a="zi" aria-label="zoom in">＋</button></div>`+S.goals.map(goal).join('')+`<p class="foot">${esc(t('emptyP'))}</p>`;}
const bar=(l,v,c)=>`<div><div class="rowt"><span>${esc(l)}</span><span style="color:${c}">${v}%</span></div><div class="trk"><div class="fl" style="width:${v}%;background:linear-gradient(90deg,${c},color-mix(in srgb,${c} 55%,#fff))"></div></div></div>`;
function viewS(){const g=S.goals,P=g.map(pct),all=g.length?Math.round(P.reduce((a,b)=>a+b,0)/g.length):0;let tk=0,dn=0;const lv=L.map(()=>[]);
 walk(g,n=>{lv[L.indexOf(n.type)].push(pct(n));if(n.type==='daily'){tk++;if(n.done)dn++;}});
 const rings=g.slice(0,6).map((n,i)=>{const r=116-i*18;return`<circle class="tr" cx="130" cy="130" r="${r}" stroke="${MC[i]}"/><circle class="vl" cx="130" cy="130" r="${r}" pathLength="100" stroke="${MC[i]}" stroke-dasharray="100" stroke-dashoffset="${100-P[i]}" ${P[i]?'':'opacity="0"'}/>`;}).join('');
 const lb=L.slice(1).map((l,k)=>{const a=lv[k+1];return a.length?bar(t(l)+' ('+a.length+')',Math.round(a.reduce((x,y)=>x+y,0)/a.length),CL[k+1]):'';}).join('');
 return`<div class="card stats"><div><b>${g.length}</b><span>${esc(t('goals'))}</span></div><div><b>${tk}</b><span>${esc(t('tasks'))}</span></div><div><b>${dn}</b><span>${esc(t('done'))}</span></div></div>
 <div class="card hero"><div class="big-ring"><svg width="260" height="260" viewBox="0 0 260 260">${rings||'<circle class="tr" cx="130" cy="130" r="116" stroke="var(--mu)"/>'}</svg><div class="ctr"><b>${all}%</b><span>${esc(t('overall'))}</span></div></div>
 <div class="bars">${g.length?g.map((n,i)=>bar(tx(n),P[i],MC[i%6])).join(''):`<p class="hint" style="text-align:center">${esc(t('noData'))}</p>`}</div></div>${lb?`<div class="card"><h3>${esc(t('byLevel'))}</h3><div class="bars">${lb}</div></div>`:''}`;}
function render(a){lang=S.settings.lang;const h=document.documentElement;h.dir=lang==='fa'?'rtl':'ltr';h.lang=lang;h.dataset.theme=S.settings.theme;h.dataset.font=S.settings.font;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.id===tab));
 const prev=[...document.querySelectorAll('.tscroll')].map(e=>e.scrollLeft);
 $('app').innerHTML=`<div class="wrap${a?' anim':''}">${tab==='g'?viewG():viewS()}</div>`;
 document.querySelectorAll('.tree').forEach(e=>e.style.zoom=S.settings.zoom||1);
 document.querySelectorAll('.tscroll').forEach((e,i)=>{e.scrollLeft=(!a&&prev[i]!=null)?prev[i]:(e.scrollWidth-e.clientWidth)/2;});}
/* ---- actions ---- */
function act(a,id){
 if(a==='ng')return goalForm();if(a==='set')return settings();
 if(a==='zi'||a==='zo'){S.settings.zoom=Math.min(1.5,Math.max(.5,Math.round(((S.settings.zoom||1)+(a==='zi'?.1:-.1))*10)/10));save();return render();}
 if(a==='tab'){tab=id;render(true);$('app').scrollTop=0;return;}
 if(a==='ad')return goalForm(id);if(a==='ed')return goalForm(id,true);
 const f=id&&find(S.goals,id);if(!f)return;
 if(a==='dl')return ask(t('ask'),()=>{if(f.p)f.p.children=f.p.children.filter(c=>c.id!==id);else S.goals=S.goals.filter(g=>g.id!==id);save();render();},t('del'));
 if(a==='tg'){f.n.done=!f.n.done;S.just=f.n.done?id:null;save();render();S.just=null;}
 if(a==='op'){S.open[id]=S.open[id]===false;save();render();}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.id);});
function openM(h){$('md').innerHTML=h;$('mb').classList.add('on');$('md').querySelectorAll('[data-x]').forEach(b=>b.onclick=closeM);}
function closeM(){$('mb').classList.remove('on');}
$('mb').addEventListener('click',e=>{if(e.target.id==='mb')closeM();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
function ask(m,fn,label){openM(`<div class="mh"><span>${esc(m)}</span></div><div class="mf"><button class="ghost" data-x>${esc(t('cancel'))}</button><button class="cta danger" id="okb">${esc(label||t('yes'))}</button></div>`);$('okb').onclick=()=>{closeM();fn();};}
function goalForm(id,editing){const f=id&&find(S.goals,id),n=f&&f.n;if(id&&!n)return;const lv=editing?n.type:(n?nextL(n.type):'main');if(!lv)return;const cur=editing?n.title:{fa:'',en:''};
 openM(`<div class="mh"><span>${esc(editing?t('edit'):(n?t('addP'):t('newT')))} · ${esc(t(lv))}</span><button class="ib" data-x aria-label="x">✕</button></div>
 <div id="gf"><div class="f"><label>${esc(t('tFa'))}</label><input name="fa" maxlength="200" dir="rtl" value="${esc(cur.fa)}" autocomplete="off"></div>
 <div class="f"><label>${esc(t('tEn'))}</label><input name="en" maxlength="200" dir="ltr" value="${esc(cur.en)}" autocomplete="off"></div><p class="hint">${esc(t('hint'))}</p>
 <div class="mf"><button type="button" class="ghost" data-x>${esc(t('cancel'))}</button><button class="cta" type="button" id="sv">${esc(t('save'))}</button></div></div>`);
 const fm=$('gf'),fa_=fm.querySelector('[name=fa]'),en_=fm.querySelector('[name=en]');(lang==='fa'?fa_:en_).focus();
 const go=()=>{const fa=fa_.value.trim(),en=en_.value.trim();if(!fa&&!en)return;const ti=cleanTitle({fa,en});
  if(editing)n.title=ti;else{(n?n.children:S.goals).push({id:uid(),type:lv,title:ti,done:false,children:[]});if(n)delete S.open[n.id];}
  save();render();closeM();};
 $('sv').onclick=go;fm.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});}
function settings(){openM(`<div class="mh"><span>${esc(t('set'))}</span><button class="ib" data-x aria-label="x">✕</button></div>
 <div class="sec"><label>${esc(t('lang'))}</label><div class="seg"><button data-l="fa" class="${lang==='fa'?'on':''}">فارسی</button><button data-l="en" class="${lang==='en'?'on':''}">English</button></div></div>
 <div class="sec"><label>${esc(t('theme'))}</label><div class="seg">${THEMES.map(k=>`<button class="th ${S.settings.theme===k?'on':''}" data-th="${k}" data-theme="${k}" style="background:linear-gradient(135deg,var(--bg) 50%,var(--ac) 50%,var(--ac2))" aria-label="${k}"><span>${esc(t(k))}</span></button>`).join('')}</div></div>
 <div class="sec"><label>${esc(t('font'))}</label><div class="seg">${FONTS.map(k=>`<button data-f="${k}" class="${S.settings.font===k?'on':''}" style="font-family:${FF[k]}">${esc(t(k))}</button>`).join('')}</div></div>
 <div class="sec"><label>${esc(t('backup'))}</label><div class="seg"><button id="ex">${esc(t('exp'))}</button><button id="im">${esc(t('imp'))}</button><button id="lk" style="flex-basis:100%">${esc(t('link'))}</button></div></div><p class="hint">${esc(t('note'))}</p>`);
 const m=$('md'),re=()=>{save();render();settings();};
 m.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.settings.lang=b.dataset.l;re();});
 m.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.settings.theme=b.dataset.th;re();});
 m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.settings.font=b.dataset.f;re();});
 $('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='goal-tree-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
 $('im').onclick=()=>$('fi').click();
 $('lk').onclick=()=>{const u=location.href.split('#')[0]+'#d='+btoa(unescape(encodeURIComponent(JSON.stringify(S))));Promise.resolve().then(()=>navigator.clipboard.writeText(u)).then(()=>toast(t('linkOk')),()=>{const i=document.createElement('input');i.readOnly=true;i.value=u;i.style.cssText='width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)';$('lk').after(i);i.select();});};}
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=v=>{try{const s=cleanState(JSON.parse(v.target.result));if(!s)throw 0;S=s;save();render();closeM();}catch(x){toast(t('bad'));}};r.readAsText(f);e.target.value='';};
/* ---- init ---- */
S=load();render(true);
(function(){const m=location.hash.match(/^#d=(.+)$/);if(!m)return;try{const s=cleanState(JSON.parse(decodeURIComponent(escape(atob(m[1])))));history.replaceState(null,'',location.href.split('#')[0]);if(s)ask(t('linkAsk'),()=>{S=s;save();render(true);});}catch(e){}})();
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){const w=document.createElement('div');w.className='warn';w.setAttribute('role','alert');w.textContent=t('nostore');document.querySelector('.hdr').after(w);}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body>
</html>
